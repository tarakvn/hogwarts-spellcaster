name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Create Flutter project
        run: |
          flutter create --org com.hogwarts --project-name hogwarts_spellcaster temp_app
          cp -f pubspec.yaml temp_app/pubspec.yaml
          rm -rf temp_app/lib
          cp -r lib temp_app/lib
          cd temp_app
          flutter pub get

      - name: Build APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hogwarts-spellcaster-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
