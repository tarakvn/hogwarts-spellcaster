name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create new Flutter project
        run: |
          flutter create --org com.hogwarts spellcaster_temp
          # فایل‌های کاربر را کپی می‌کنیم
          cp pubspec.yaml spellcaster_temp/ || true
          cp -r lib spellcaster_temp/ || true
          cd spellcaster_temp
          flutter pub get

      - name: Build APK
        working-directory: spellcaster_temp
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hogwarts-spellcaster-apk
          path: spellcaster_temp/build/app/outputs/flutter-apk/app-release.apk
